<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบฟอร์มลงทะเบียนนักศึกษาใหม่</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header id="main-header">
        <h1>ระบบลงทะเบียน<span class="highlight">นักศึกษาใหม่</span></h1>
        <p>กรุณากรอกข้อมูลให้ครบถ้วน</p>
    </header>

    <main>
        <div class="form-container">
            <form>
                <fieldset>
                    <legend>ข้อมูลการเข้าสู่ระบบ</legend>

                    <div class="form-group">
                        <label for="username">ชื่อผู้ใช้ (Username): <span class="required">*</span></label>
                        <input type="text" id="username" name="username" required>
                    </div>

                    <div class="form-group">
                        <label for="password">รหัสผ่าน (Password): <span class="required">*</span></label>
                        <input type="password" id="password" name="password" required>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>ข้อมูลส่วนตัว</legend>

                    <div class="form-group">
                        <label for="fullname">ชื่อ-นามสกุล:</label>
                        <input type="text" id="fullname" name="fullname" placeholder="เช่น นายสมชาย ใจดี">
                    </div>

                    <div class="form-group">
                        <label for="email">อีเมล:</label>
                        <input type="email" id="email" name="email">
                    </div>

                    <div class="form-group">
                        <label for="birthdate">วัน/เดือน/ปีเกิด:</label>
                        <input type="date" id="birthdate" name="birthdate">
                    </div>

                    <div class="form-group">
                        <span class="group-label">เพศ:</span>
                        <div class="inline-options">
                            <input type="radio" id="male" name="gender" value="ชาย">
                            <label for="male">ชาย</label>

                            <input type="radio" id="female" name="gender" value="หญิง">
                            <label for="female">หญิง</label>

                            <input type="radio" id="other" name="gender" value="อื่นๆ">
                            <label for="other">อื่นๆ</label>
                        </div>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>ข้อมูลการศึกษา</legend>

                    <div class="form-group">
                        <label for="level">ระดับชั้น:</label>
                        <select id="level" name="level">
                            <option value="ปวช.1">ปวช.1</option>
                            <option value="ปวช.2">ปวช.2</option>
                            <option value="ปวช.3">ปวช.3</option>
                            <option value="ปวส.1">ปวส.1</option>
                            <option value="ปวส.2">ปวส.2</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <span class="group-label">ความสนใจเพิ่มเติม:</span>
                        <div class="inline-options">
                            <input type="checkbox" id="web" name="interest" value="Web Design">
                            <label for="web">Web Design</label>

                            <input type="checkbox" id="db" name="interest" value="Database">
                            <label for="db">Database</label>

                            <input type="checkbox" id="coding" name="interest" value="Coding">
                            <label for="coding">Coding</label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="address">ที่อยู่ปัจจุบัน:</label>
                        <textarea id="address" name="address" rows="4" cols="50"></textarea>
                    </div>
                </fieldset>

                <div class="form-actions">
                    <button type="submit" class="btn-submit">ลงทะเบียน</button>
                    <button type="reset" class="btn-reset">ล้างข้อมูล</button>
                </div>
            </form>
        </div>
    </main>

    <footer id="main-footer">
        <p>สงวนลิขสิทธิ์ 2026 แผนกวิชาเทคโนโลยีสารสนเทศ วิทยาลัยเทคนิคสุราษฎร์ธานี</p>
    </footer>

</body>

</html>
